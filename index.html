<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ゼロから始めるAIアプリ開発｜使用プロンプト</title>

  <meta name="description" content="動画内で使用したGoogle AI Studioのプロンプトを公開しています。">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      width: min(92%, 620px);
      margin: 0 auto;
      padding: 40px 0 50px;
    }

    /* ヘッダー */
    .profile {
      text-align: center;
      margin-bottom: 32px;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #111;
      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      font-weight: 700;
    }

    .profile h1 {
      margin: 0;
      font-size: 24px;
    }

    .profile p {
      margin: 10px 0 0;
      color: #666;
      font-size: 14px;
      line-height: 1.7;
    }

    /* セクション */
    .section-title {
      margin: 30px 0 12px;
      font-size: 15px;
      font-weight: 700;
    }

    /* リンクカード */
    .link-card {
      display: block;
      text-decoration: none;
      color: #222;

      background: #fff;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 12px;

      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    }

    .link-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .link-description {
      font-size: 13px;
      color: #777;
      line-height: 1.5;
    }

    /* GitHubカード */
    .github {
      background: #111;
      color: #fff;
    }

    .github .link-description {
      color: #ccc;
    }

    /* フッター */
    footer {
      margin-top: 40px;
      text-align: center;
      color: #999;
      font-size: 12px;
    }

    /* スマホ */
    @media (max-width: 480px) {
      .container {
        padding-top: 30px;
      }

      .profile h1 {
        font-size: 21px;
      }

      .icon {
        width: 70px;
        height: 70px;
        font-size: 24px;
      }

      .link-card {
        padding: 16px 18px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- プロフィール -->
    <header class="profile">

      <div class="icon">
        TL
      </div>

      <h1>Tauri Lab</h1>

      <p>
        Tauri × AIでアプリ開発<br>
        動画で使用したプロンプトを公開しています
      </p>

    </header>


    <!-- 使用プロンプト -->
    <div class="section-title">
      使用プロンプト
    </div>


    <!-- 電卓アプリ -->
    <a
      class="link-card"
      href="https://gist.github.com/miyabi-studio/5e6addd3c420736caeb167d02d7e8ba5"
      target="_blank"
      rel="noopener noreferrer"
    >

      <div class="link-title">
        シンプルで使いやすいデスクトップ電卓アプリ
      </div>

      <div class="link-description">
        Google AI Studioで使用したプロンプト
      </div>

    </a>


    <footer>
      © 2026 ゼロから始めるAIアプリ開発
    </footer>

  </main>

</body>
</html>
